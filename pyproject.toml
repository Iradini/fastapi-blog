[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Iradini", email = "mariairadini@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "aiosmtplib>=4.0.2",
    "aiosqlite>=0.22.1",
    "alembic>=1.16.5",
    "boto3>=1.42.97",
    "fastapi[standard]>=0.128.8",
    "greenlet>=3.2.5",
    "pillow>=11.3.0",
    "psycopg[binary]>=3.2.13",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
fastapi-blog = "fastapi_blog:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto[s3]>=5.1.22",
    "pytest>=8.4.2",
]
